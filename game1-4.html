<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ด่านที่ 4: ไขรหัสสะกดคำ - นักสืบสัตว์น้อย</title>
    <!-- โหลด Tailwind CSS จาก CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap');
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-2 md:p-4">

    <!-- กรอบหน้าจอหลักของเกม -->
    <div class="relative w-full max-w-5xl aspect-[4/3] rounded-3xl shadow-2xl overflow-hidden border-4 border-amber-200/50 flex flex-col justify-between p-6 md:p-8"
         style="background-image: url('Game1BG.png'); background-size: cover; background-position: center;">

        <!-- ส่วนหัว: ปุ่มกลับหน้าหลัก และ ชื่อด่าน -->
        <header class="flex items-center justify-between z-10 w-full">
            <!-- ปุ่มกลับหน้าแรก -->
            <a href="index.html" class="bg-white/90 hover:bg-white text-amber-800 font-bold px-4 py-2 rounded-full shadow-md transition flex items-center gap-2 border-2 border-amber-300">
                🏠 หน้าหลัก
            </a>
            <!-- ป้ายชื่อด่าน -->
            <div class="bg-amber-100/90 border-2 border-amber-400 px-6 py-2 rounded-full shadow-md">
                <h1 class="text-lg md:text-xl font-bold text-amber-800">🔤 ด่านที่ 4: ไขรหัสสะกดคำ (C-A-T)</h1>
            </div>
            <div class="w-20"></div> <!-- เว้นพื้นที่จัดกึ่งกลาง -->
        </header>

        <!-- ส่วนกลาง: กระดานไขรหัสสะกดคำ -->
        <main class="flex flex-col items-center justify-center my-auto gap-6 z-10 w-full max-w-2xl mx-auto">
            
            <!-- กรอบคำถามและรูปภาพ -->
            <div class="bg-white/95 backdrop-blur-md border-4 border-amber-400 rounded-3xl p-6 shadow-xl text-center w-full flex flex-col items-center gap-4">
                
                <div class="flex items-center gap-4">
                    <span class="text-5xl">🐱</span>
                    <p class="text-lg md:text-xl font-bold text-gray-800">
                        "ช่วยเหล่านักสืบเรียงการ์ดตัวอักษรสะกดคำว่า CAT ให้ถูกต้องที!"
                    </p>
                </div>

                <!-- ช่องว่างสำหรับเติมตัวอักษร (Target Slots) -->
                <div class="flex justify-center gap-3 my-2" id="slot-container">
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-amber-50 border-4 border-dashed border-amber-400 rounded-2xl flex items-center justify-center text-3xl font-bold text-amber-900 slot shadow-inner" data-index="0">?</div>
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-amber-50 border-4 border-dashed border-amber-400 rounded-2xl flex items-center justify-center text-3xl font-bold text-amber-900 slot shadow-inner" data-index="1">?</div>
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-amber-50 border-4 border-dashed border-amber-400 rounded-2xl flex items-center justify-center text-3xl font-bold text-amber-900 slot shadow-inner" data-index="2">?</div>
                </div>

                <!-- ปุ่มการ์ดตัวอักษรให้เลือก (สลับตำแหน่ง T, C, A) -->
                <div class="flex justify-center gap-4 mt-2" id="letter-container">
                    <button onclick="selectLetter('T', this)" class="w-16 h-16 md:w-20 md:h-20 bg-sky-400 hover:bg-sky-50 text-white rounded-2xl shadow-lg text-3xl font-bold transition transform hover:scale-110 cursor-pointer letter-btn">T</button>
                    <button onclick="selectLetter('C', this)" class="w-16 h-16 md:w-20 md:h-20 bg-amber-400 hover:bg-amber-50 text-white rounded-2xl shadow-lg text-3xl font-bold transition transform hover:scale-110 cursor-pointer letter-btn">C</button>
                    <button onclick="selectLetter('A', this)" class="w-16 h-16 md:w-20 md:h-20 bg-rose-400 hover:bg-rose-50 text-white rounded-2xl shadow-lg text-3xl font-bold transition transform hover:scale-110 cursor-pointer letter-btn">A</button>
                </div>

                <!-- ปุ่มรีเซ็ตการเลือก -->
                <button onclick="resetPuzzle()" class="text-sm font-semibold text-gray-500 hover:text-red-500 transition underline cursor-pointer mt-1">
                    🔄 เริ่มเรียงใหม่
                </button>

            </div>

        </main>

        <!-- ส่วนท้าย: แสดงผลลัพธ์และปุ่มจบภารกิจ -->
        <footer class="flex flex-col items-center justify-center z-10 gap-2">
            <p id="result-text" class="text-lg font-bold text-amber-900 drop-shadow-sm"></p>
            <!-- ปุ่มซ่อนไว้จนกว่าจะไขรหัสสำเร็จ -->
            <div id="finish-container" class="hidden">
                <a href="index.html" class="bg-green-500 hover:bg-green-600 text-white font-bold px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105 flex items-center gap-2 text-lg animate-bounce">
                    🏆 ผ่านภารกิจทั้งหมดแล้ว! กลับหน้าหลัก
                </a>
            </div>
        </footer>

    </div>

    <!-- สคริปต์ควบคุมระบบมินิเกมไขรหัสตัวอักษร -->
    <script>
        const targetWord = ['C', 'A', 'T'];
        let currentSlot = 0;
        let playerAnswer = ['', '', ''];

        function selectLetter(letter, btnElement) {
            if (currentSlot < 3) {
                playerAnswer[currentSlot] = letter;
                
                // อัปเดตช่องแสดงผล
                const slots = document.querySelectorAll('.slot');
                slots[currentSlot].innerText = letter;
                slots[currentSlot].classList.remove('border-dashed', 'bg-amber-50');
                slots[currentSlot].classList.add('bg-amber-200', 'border-solid');

                // ซ่อนปุ่มตัวอักษรที่ถูกเลือกไปแล้วชั่วคราว
                btnElement.style.opacity = '0.3';
                btnElement.style.pointerEvents = 'none';
                btnElement.dataset.slotIndex = currentSlot;

                currentSlot++;

                // ถ้าเติมครบ 3 ช่องแล้ว ให้ตรวจสอบคำตอบทันที
                if (currentSlot === 3) {
                    checkResult();
                }
            }
        }

        function checkResult() {
            const resultText = document.getElementById('result-text');
            const finishContainer = document.getElementById('finish-container');
            
            const isCorrect = playerAnswer.every((val, index) => val === targetWord[index]);

            if (isCorrect) {
                resultText.innerHTML = "🎉 ยอดเยี่ยมมาก! ไขรหัสคำว่า CAT สำเร็จ คุณคือนักสืบตัวจริง!";
                resultText.className = "text-xl font-bold text-green-600 drop-shadow-md animate-bounce";
                finishContainer.classList.remove('hidden');
            } else {
                resultText.innerHTML = "❌ ยังไม่ถูกต้องนะ ลองกดเริ่มเรียงใหม่ดูอีกครั้งสิคะ!";
                resultText.className = "text-xl font-bold text-red-600 drop-shadow-md";
            }
        }

        function resetPuzzle() {
            currentSlot = 0;
            playerAnswer = ['', '', ''];
            
            const slots = document.querySelectorAll('.slot');
            slots.forEach(slot => {
                slot.innerText = '?';
                slot.classList.add('border-dashed', 'bg-amber-50');
                slot.classList.remove('bg-amber-200', 'border-solid');
            });

            const letterBtns = document.querySelectorAll('.letter-btn');
            letterBtns.forEach(btn => {
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            });

            document.getElementById('result-text').innerText = '';
            document.getElementById('finish-container').classList.add('hidden');
        }
    </script>

</body>
</html>
