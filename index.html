<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่ตัวเลข - อนุบาล 5 ขวบ</title>
    <!-- ใช้ Tailwind CSS สำหรับตกแต่งหน้าเว็บให้สวยงาม -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-sky-100 p-6 font-sans">

    <!-- ส่วนหัวข้อเกม -->
    <header class="mb-6 text-center">
        <h1 class="text-3xl font-bold text-purple-700">
            สวนสัตว์พาเพลิน: จับคู่ภาพกับตัวเลข
        </h1>
        <p class="text-gray-600 mt-2">หน่วย: แรกรับประทับใจ (อนุบาล 5 ขวบ)</p>
    </header>

    <!-- พื้นที่เล่นเกมหลัก -->
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg text-center border-4 border-yellow-300">
        <!-- แสดงภาพสิ่งของที่ให้เด็กนับ -->
        <div id="item-display" class="text-7xl mb-6 p-4 bg-yellow-50 rounded-2xl inline-block">
            ✏️✏️✏️
        </div>
        
        <p class="text-xl font-medium text-gray-700 mb-6">
            ช่วยนับและเลือกตัวเลขที่ถูกต้องกันเถอะค่ะ!
        </p>

        <!-- ปุ่มตัวเลือกคำตอบ -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="checkAnswer(2)" class="bg-pink-400 hover:bg-pink-500 text-white text-3xl font-bold py-5 rounded-2xl shadow-md transition-transform transform hover:scale-105 active:scale-95">2</button>
            <button onclick="checkAnswer(3)" class="bg-pink-400 hover:bg-pink-500 text-white text-3xl font-bold py-5 rounded-2xl shadow-md transition-transform transform hover:scale-105 active:scale-95">3</button>
            <button onclick="checkAnswer('๓')" class="bg-pink-400 hover:bg-pink-500 text-white text-3xl font-bold py-5 rounded-2xl shadow-md transition-transform transform hover:scale-105 active:scale-95">๓</button>
            <button onclick="checkAnswer(5)" class="bg-pink-400 hover:bg-pink-500 text-white text-3xl font-bold py-5 rounded-2xl shadow-md transition-transform transform hover:scale-105 active:scale-95">5</button>
        </div>

        <!-- ส่วนแสดงผลการตอบ (Feedback) -->
        <div id="feedback" class="mt-6 text-2xl font-semibold text-green-600 h-10"></div>
    </div>

    <!-- แถบแสดงคะแนนดาวสะสม -->
    <footer class="mt-6 text-xl font-bold text-orange-500 bg-white px-6 py-2 rounded-full shadow-md">
        ⭐ คะแนนดาวสะสม: <span id="score">0</span> ดวง
    </footer>

    <script>
        let score = 0;
        function checkAnswer(selected) {
            const feedbackEl = document.getElementById('feedback');
            const scoreEl = document.getElementById('score');
            
            if (selected === 3 || selected === '๓') {
                feedbackEl.innerText = '🎉 เก่งมากค่ะ! ถูกต้องนะคะ';
                feedbackEl.className = 'mt-6 text-2xl font-semibold text-green-600 animate-bounce';
                score += 1;
                scoreEl.innerText = score;
            } else {
                feedbackEl.innerText = '💡 อุ๊ย! ลองนับใหม่อีกรอบนะจ๊ะ';
                feedbackEl.className = 'mt-6 text-2xl font-semibold text-red-500';
            }
        }
    </script>
</body>
</html>
