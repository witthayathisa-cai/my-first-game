<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวนสัตว์พาเพลิน: เกมจับคู่ตัวเลขแสนสนุก</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-amber-100 to-sky-200 p-4">

    <!-- หัวข้อเกม -->
    <header class="mb-4 text-center">
        <h1 class="text-3xl md:text-4xl font-bold text-pink-600 drop-shadow-sm">
            🌟 สวนสัตว์พาเพลิน: นับเลขกันเถอะ! 🐻
        </h1>
        <p class="text-gray-600 font-medium mt-1">หน่วย: แรกรับประทับใจ (อนุบาล 5 ขวบ)</p>
    </header>

    <!-- ปุ่มกดเพื่อกลับหน้าหลัก -->
    <a href="index.html" class="bg-gray-400 text-white px-4 py-2 rounded-lg font-bold" style="margin-bottom: 15px; display: inline-block;">
        🏠 กลับหน้าหลัก
    </a>

    <!-- กล่องเกมหลัก -->
    <div class="bg-white/90 backdrop-blur-md p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md text-center border-4 border-yellow-300">
        
        <!-- แถบบอกด่าน -->
        <div class="flex justify-between items-center mb-4 text-sm font-semibold text-purple-600 bg-purple-50 px-4 py-2 rounded-full">
            <span id="level-indicator">ข้อที่ 1 จาก 3</span>
            <span>⭐ ดาวสะสม: <span id="score">0</span> ดวง</span>
        </div>

        <!-- พื้นแสดงภาพสิ่งของ -->
        <div id="item-display" class="text-6xl md:text-7xl mb-6 p-6 bg-yellow-50 rounded-3xl inline-block shadow-inner border-2 border-dashed border-yellow-200">
            ✏️✏️✏️
        </div>
        
        <p id="question-text" class="text-xl font-semibold text-gray-700 mb-6">
            ช่วยนับซิคะว่ามีดินสอกี่แท่งเอ่ย?
        </p>

        <!-- ปุ่มตัวเลือกคำตอบ -->
        <div id="choices-container" class="grid grid-cols-2 gap-4">
            <!-- ปุ่มจะถูกสร้างด้วย JavaScript ด้านล่าง -->
        </div>

        <!-- ข้อความแสดงผล (Feedback) -->
        <div id="feedback" class="mt-5 text-xl font-bold h-10 flex items-center justify-center"></div>
    </div>

    <script>
        // ข้อมูลคำถามหลายๆ ข้อ พร้อมระบุไฟล์เสียง .mp3 อ่านโจทย์
        const questions = [
            { items: "🦁🦁🦁", count: 3, text: "ช่วยนับซิคะว่ามีสิงโตตัวน้อยกี่ตัวเอ่ย?", audio: "sounds/q1.mp3", choices: [2, 3, 4, 5], correct: 3 },
            { items: "🐘🐘🐘🐘", count: 4, text: "ว้าว! มีช้างกี่ตัวเอ่ย มาช่วยกันนับหน่อยจ้า", audio: "sounds/q2.mp3", choices: [1, 4, 3, 5], correct: 4 },
            { items: "🐵🐵", count: 2, text: "น้องลิงซุกซนมีกี่ตัวเอ่ย?", audio: "sounds/q3.mp3", choices: [2, 1, 3, 5], correct: 2 }
        ];

        // ไฟล์เสียงเอฟเฟกต์ .mp3 สำหรับผลลัพธ์
        const sfx = {
            correct: "sounds/correct.mp3",
            wrong: "sounds/wrong.mp3"
        };

        let currentLevel = 0;
        let score = 0;
        let isAnswerLocked = false; // ตัวแปรล็อกปุ่มกันกดซ้ำซ้อนขณะเสียงกำลังเล่น

        function loadQuestion() {
            isAnswerLocked = false; // ปลดล็อกให้เด็กกดเลือกคำตอบได้
            const q = questions[currentLevel];
            document.getElementById('level-indicator').innerText = `ข้อที่ ${currentLevel + 1} จาก ${questions.length}`;
            document.getElementById('item-display').innerText = q.items;
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('feedback').innerText = "";

            // 🔊 เล่นไฟล์เสียง .mp3 อ่านโจทย์อัตโนมัติเมื่อขึ้นข้อใหม่
            if (q.audio) {
                let questionAudio = new Audio(q.audio);
                questionAudio.play().catch(error => {
                    console.log("เบราว์เซอร์บล็อกการเล่นเสียงอัตโนมัติ", error);
                });
            }

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = "";

            q.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.innerText = choice;
                btn.className = "bg-pink-400 hover:bg-pink-500 active:scale-95 text-white text-3xl font-bold py-4 rounded-2xl shadow-lg transition-transform transform hover:scale-105";
                btn.onclick = () => checkAnswer(choice, q.correct);
                choicesContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (isAnswerLocked) return; // ถ้าตอบไปแล้วและเสียงกำลังเล่นอยู่ ห้ามกดซ้ำ

            const feedbackEl = document.getElementById('feedback');
            const scoreEl = document.getElementById('score');

            // เปรียบเทียบคำตอบ
            if (String(selected) === String(correct)) {
                isAnswerLocked = true; // ล็อกปุ่มทันที
                feedbackEl.innerText = '🎉 เย้! ถูกต้อง เก่งมากๆ เลยค่ะ';
                feedbackEl.className = 'mt-5 text-xl font-bold text-green-600 animate-bounce h-10 flex items-center justify-center';
                score += 1;
                scoreEl.innerText = score;

                // 🔊 เล่นไฟล์เสียง .mp3 แสดงความยินดีตอนตอบถูก
                let correctSound = new Audio(sfx.correct);
                correctSound.play().catch(error => {
                    console.log("ไม่สามารถเล่นไฟล์เสียงตอบถูกได้", error);
                    nextRoundOrFinish(); // เผื่อไฟล์เสียงเล่นไม่ได้ ให้ไปต่อทันที
                });

                // 🎵 รอจนกว่าเสียง `correct.mp3` จะเล่นจบแบบสมบูรณ์ ค่อยเปลี่ยนไปข้อถัดไป
                correctSound.onended = () => {
                    nextRoundOrFinish();
                };

            } else {
                isAnswerLocked = true; // ล็อกปุ่มชั่วคราวตอนตอบผิด เพื่อรอให้เด็กตั้งตัวใหม่
                feedbackEl.innerText = '💡 อุ๊ย! ลองนับใหม่อีกรอบนะจ๊ะ สู้ๆ!';
                feedbackEl.className = 'mt-5 text-xl font-bold text-red-500 h-10 flex items-center justify-center';

                // 🔊 เล่นไฟล์เสียง .mp3 ตอนตอบผิด
                let wrongSound = new Audio(sfx.wrong);
                wrongSound.play().catch(error => {
                    console.log("ไม่สามารถเล่นไฟล์เสียงตอบผิดได้", error);
                    isAnswerLocked = false;
                });

                // 🎵 รอให้เสียงตอบผิดเล่นจบ แล้วค่อยปลดล็อกให้เด็กกดเลือกใหม่ได้
                wrongSound.onended = () => {
                    isAnswerLocked = false;
                };
            }
        }

        function nextRoundOrFinish() {
            currentLevel++;
            if (currentLevel < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('item-display').innerText = "🏆";
                document.getElementById('question-text').innerText = "เก่งมากๆ เลยค่ะ! เล่นครบทุกข้อแล้วจ้า";
                document.getElementById('choices-container').innerHTML = `<button onclick="restartGame()" class="bg-pink-500 text-white text-2xl font-bold py-4 px-6 rounded-2xl col-span-2 shadow-lg">เล่นใหม่อีกครั้ง</button>`;
                document.getElementById('feedback').innerText = `🌟 คะแนนรวมทั้งหมด: ${score} ดวง`;
            }
        }

        function restartGame() {
            currentLevel = 0;
            score = 0;
            isAnswerLocked = false;
            document.getElementById('score').innerText = score;
            loadQuestion();
        }

        // เริ่มต้นรันเกมข้อแรก
        loadQuestion();
    </script>
</body>
</html>
