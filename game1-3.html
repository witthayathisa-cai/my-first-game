<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ด่านที่ 3: รู้จักคำศัพท์ - นักสืบสัตว์น้อย</title>
    <!-- โหลด Tailwind CSS จาก CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap');
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-2 md:p-4">

    <!-- กรอบหน้าจอหลักของเกม -->
    <div class="relative w-full max-w-5xl aspect-[4/3] rounded-3xl shadow-2xl overflow-hidden border-4 border-amber-200/50 flex flex-col justify-between p-6 md:p-8"
         style="background-image: url('Game1BG.png'); background-size: cover; background-position: center;">

        <!-- ส่วนหัว: ปุ่มกลับหน้าหลัก และ ชื่อด่าน -->
        <header class="flex items-center justify-between z-10 w-full">
            <!-- ปุ่มกลับหน้าแรก -->
            <a href="index.html" class="bg-white/90 hover:bg-white text-amber-800 font-bold px-4 py-2 rounded-full shadow-md transition flex items-center gap-2 border-2 border-amber-300">
                🏠 หน้าหลัก
            </a>
            <!-- ป้ายชื่อด่าน -->
            <div class="bg-amber-100/90 border-2 border-amber-400 px-6 py-2 rounded-full shadow-md">
                <h1 class="text-lg md:text-xl font-bold text-amber-800">📖 ด่านที่ 3: สมุดบันทึกคำศัพท์สัตว์น้อย</h1>
            </div>
            <div class="w-20"></div> <!-- เว้นพื้นที่จัดกึ่งกลาง -->
        </header>

        <!-- ส่วนกลาง: สมุดคำศัพท์แบบอินเตอร์แอคทีฟ -->
        <main class="flex flex-col items-center justify-center my-auto gap-6 z-10 w-full max-w-2xl mx-auto">
            
            <!-- การ์ดสมุดคำศัพท์ -->
            <div class="bg-white/95 backdrop-blur-md border-4 border-amber-400 rounded-3xl p-6 md:p-8 shadow-2xl text-center w-full flex flex-col items-center gap-4 relative">
                
                <!-- รูปภาพสัตว์ตัวเอก -->
                <div class="w-36 h-36 md:w-44 md:h-44 bg-amber-50 rounded-2xl flex items-center justify-center border-4 border-amber-200 shadow-inner">
                    <span class="text-8xl animate-pulse">🐱</span>
                </div>

                <!-- แสดงคำศัพท์ (ภาษาไทย / อังกฤษ) -->
                <div class="flex flex-col items-center gap-1">
                    <h2 class="text-3xl md:text-4xl font-bold text-amber-900">แมว (Cat)</h2>
                    <p class="text-sm md:text-base text-gray-600 font-semibold">คำศัพท์หมวดสัตว์เลี้ยงแสนรัก</p>
                </div>

                <!-- ปุ่มกดฟังเสียงอ่านคำศัพท์ -->
                <button onclick="speakVocabulary()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-full shadow-lg transition transform hover:scale-105 flex items-center gap-2 text-base cursor-pointer">
                    🔊 ฟังเสียงอ่านคำศัพท์
                </button>
            </div>

        </main>

        <!-- ส่วนท้าย: ปุ่มไปด่านถัดไป -->
        <footer class="flex flex-col items-center justify-center z-10">
            <a href="stage4.html" class="bg-green-500 hover:bg-green-600 text-white font-bold px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105 flex items-center gap-2 text-lg">
                ➡️ ไปด่านที่ 4 (ไขรหัสสะกดคำ)
            </a>
        </footer>

    </div>

    <!-- สคริปต์สังเคราะห์เสียงอ่านคำศัพท์ภาษาไทยและอังกฤษ -->
    <script>
        function speakVocabulary() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = "แมว, ซี เอ ที แคท, แมวเหมียว";
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("เบราว์เซอร์ไม่รองรับเสียงพูดค่ะ");
            }
        }
    </script>

</body>
</html>
